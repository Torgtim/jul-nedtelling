<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nedtelling til jul 🎄</title>
<meta name="theme-color" content="#0b1a2b">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jul!">
<style>
  :root{
    --bg-top:#0b1a2b;
    --bg-bottom:#132f4a;
    --red:#d1453b;
    --green:#2f8f5b;
    --gold:#f3c969;
    --text:#f5f7fa;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    height:100%;
    overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(ellipse at top, var(--bg-bottom), var(--bg-top));
    color:var(--text);
  }
  .sky{
    position:fixed;
    inset:0;
    z-index:0;
  }
  .flake{
    position:absolute;
    top:-10px;
    color:rgba(255,255,255,0.85);
    user-select:none;
    pointer-events:none;
    animation-name:fall;
    animation-timing-function:linear;
    animation-iteration-count:infinite;
  }
  @keyframes fall{
    to{ transform: translateY(110vh) translateX(var(--drift,0px)); }
  }
  .wrap{
    position:relative;
    z-index:1;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:24px;
  }
  .tree{
    font-size:3rem;
    margin-bottom:4px;
    filter:drop-shadow(0 4px 10px rgba(0,0,0,0.4));
  }
  h1{
    margin:0 0 6px;
    font-size:1.3rem;
    font-weight:600;
    letter-spacing:0.5px;
    color:var(--gold);
    text-transform:uppercase;
  }
  .sub{
    margin:0 0 28px;
    font-size:0.95rem;
    opacity:0.75;
  }
  .grid{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .cell{
    background:rgba(255,255,255,0.07);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:16px;
    padding:16px 14px;
    min-width:78px;
    backdrop-filter:blur(6px);
  }
  .num{
    font-size:2.4rem;
    font-weight:700;
    line-height:1;
    font-variant-numeric:tabular-nums;
  }
  .num.red{color:var(--red);}
  .num.green{color:var(--green);}
  .num.gold{color:var(--gold);}
  .num.white{color:var(--text);}
  .label{
    margin-top:6px;
    font-size:0.7rem;
    text-transform:uppercase;
    letter-spacing:1px;
    opacity:0.65;
  }
  .done{
    font-size:1.6rem;
    font-weight:700;
    color:var(--gold);
  }
  footer{
    position:absolute;
    bottom:14px;
    font-size:0.7rem;
    opacity:0.4;
  }
  .skip-btn{
    position:absolute;
    bottom:46px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.18);
    color:var(--text);
    font-size:0.8rem;
    letter-spacing:0.5px;
    padding:10px 18px;
    border-radius:999px;
    cursor:pointer;
    backdrop-filter:blur(6px);
    transition:transform 0.15s ease, background 0.15s ease;
  }
  .skip-btn:hover{
    background:rgba(255,255,255,0.16);
  }
  .skip-btn:active{
    transform:translateX(-50%) scale(0.96);
  }
</style>
</head>
<body>
  <div class="sky" id="sky"></div>
  <div class="wrap">
    <div class="tree">🎄</div>
    <h1>Det er snart jul</h1>
    <p class="sub" id="dateLabel"></p>
    <div class="grid" id="grid">
      <div class="cell"><div class="num red" id="d">00</div><div class="label">Dager</div></div>
      <div class="cell"><div class="num green" id="h">00</div><div class="label">Timer</div></div>
      <div class="cell"><div class="num gold" id="m">00</div><div class="label">Min</div></div>
      <div class="cell"><div class="num white" id="s">00</div><div class="label">Sek</div></div>
    </div>
  </div>
  <button class="skip-btn" id="skipBtn">⏩ Time skip</button>
  <audio id="skipAudio" src="surprise.mp3" preload="none"></audio>
  <footer>Spakkraft 🎅</footer>
<script>
function nextChristmas(){
  const now = new Date();
  let year = now.getFullYear();
  let target = new Date(year, 11, 24, 0, 0, 0);
  if (now > target){
    target = new Date(year + 1, 11, 24, 0, 0, 0);
  }
  return target;
}

const target = nextChristmas();
document.getElementById('dateLabel').textContent =
  target.toLocaleDateString('nb-NO', { day:'numeric', month:'long', year:'numeric' });

const dEl = document.getElementById('d');
const hEl = document.getElementById('h');
const mEl = document.getElementById('m');
const sEl = document.getElementById('s');
const grid = document.getElementById('grid');

function pad(n){ return String(n).padStart(2,'0'); }

function tick(){
  const now = new Date();
  const diff = target - now;
  if (diff <= 0){
    grid.innerHTML = '<div class="done">🎁 Gledelig jul! 🎁</div>';
    clearInterval(timer);
    return;
  }
  const d = Math.floor(diff / 86400000);
  const h = Math.floor((diff % 86400000) / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  const s = Math.floor((diff % 60000) / 1000);
  dEl.textContent = pad(d);
  hEl.textContent = pad(h);
  mEl.textContent = pad(m);
  sEl.textContent = pad(s);
}
tick();
const timer = setInterval(tick, 1000);

// snøfall
const sky = document.getElementById('sky');
const flakes = ['❄','❅','❆','·'];
for (let i=0;i<40;i++){
  const f = document.createElement('div');
  f.className = 'flake';
  f.textContent = flakes[Math.floor(Math.random()*flakes.length)];
  const size = 0.6 + Math.random()*1.4;
  f.style.left = Math.random()*100 + 'vw';
  f.style.fontSize = size + 'rem';
  f.style.opacity = 0.3 + Math.random()*0.6;
  f.style.setProperty('--drift', (Math.random()*60-30) + 'px');
  const dur = 8 + Math.random()*12;
  f.style.animationDuration = dur + 's';
  f.style.animationDelay = (-Math.random()*dur) + 's';
  sky.appendChild(f);
}

const skipBtn = document.getElementById('skipBtn');
const skipAudio = document.getElementById('skipAudio');
skipBtn.addEventListener('click', () => {
  try {
    if (!skipAudio.paused) {
      skipAudio.pause();
    }
    skipAudio.currentTime = 0;
  } catch (err) {
    // preload="none" means currentTime can't be set before metadata loads; ignore and just play.
  }
  const playPromise = skipAudio.play();
  if (playPromise && playPromise.catch) {
    playPromise.catch((err) => console.warn('Kunne ikke spille lyd:', err));
  }
});

if ('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
